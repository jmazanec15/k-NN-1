plugins {
    id 'java'
    id 'java-library'
    id 'jacoco'
    id "io.freefair.lombok"
    id 'com.diffplug.spotless' version '6.25.0'
    id 'opensearch.build'
}

description = "OpenSearch Nmslib Engine"

dependencies {
    api project(":enginelib")
    testImplementation "org.opensearch.test:framework:${opensearch_version}"
}

publishing {
    publications {
        pluginZip(MavenPublication) {
            pom {
                name = "opensearch-knn-nmslib"
                description = 'OpenSearch Nmslib Engine'
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        name = "OpenSearch"
                        url = "https://github.com/opensearch-project/k-NN/engines/nmslib"
                    }
                }
            }
        }
    }
}